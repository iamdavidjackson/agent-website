name = "agent-website"
main = ".open-next/worker.js"
compatibility_date = "2026-08-07"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

[[routes]]
pattern = "iamdavidjackson.com/*"
zone_id = "44ae18acfa98783d56ef4f7d0b1ed807"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "agent-website"

[[d1_databases]]
binding = "CAREER_DB"
database_name = "career-studio"
database_id = "352e7401-065e-43a7-bb91-e189412da43d"

[[r2_buckets]]
binding = "CAREER_ARTIFACTS"
bucket_name = "career-studio-artifacts"

[observability]
enabled = true

[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 10
period = 60
